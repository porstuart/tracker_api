spring:
  datasource:
    url:      jdbc:postgresql://localhost:5432/expenses_tracker
    username: tracker_user
    password: tracker_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Let Flyway handle migrations
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL10Dialect
        format_sql: true

  flyway:
    enabled:        true
    locations:      classpath:db/migration
    baseline-on-migrate: true
    out-of-order:   false

  jooq:
    sql-dialect: POSTGRES
    # Enables Spring Boot auto-configuration for jOOQ
    fetch-one-converted-to-optional: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.expenses: DEBUG
    org.jooq: DEBUG   # shows generated SQL in console — set INFO to silence
    org.springframework.web: DEBUG
    org.springframework.transaction: DEBUG